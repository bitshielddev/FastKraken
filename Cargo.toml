[package]
name = "fastkraken"
version = "0.9.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
publish-replay = []

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
notify = "8.2"
async-channel = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rmcp = { version = "=3.12.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync", "macros"] }
sha2 = "0.10"
hex = "0.4"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
url = "2"
unicode-segmentation = "1"
tempfile = "3"
libc = "0.2"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11", "font-kit"] }

[profile.dev]
debug = false
